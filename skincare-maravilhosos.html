<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Skincare Maravilhosos | Bella e Dellicada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <a href="index.html">
    <img src="img/logo.png" class="logo">
  </a>
  <h1 class="page-title">Skincare Maravilhosos</h1>
</header>

<section class="products-grid" id="category-products"></section>

<footer>
  <p>© 2026 Bella e Dellicada</p>
</footer>

<script>
fetch('products.json')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('category-products');

    data.products
      .filter(p => p.category === 'skincare-maravilhosos')
      .forEach(p => {
        container.innerHTML += `
          <div class="product-card">
            <img src="${p.images[0]}">
            <h4>${p.name}</h4>
            <a href="products.html?id=${p.id}">Ver detalhes</a>
          </div>
        `;
      });
  });
</script>

</body>
</html>
